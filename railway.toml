[build]
buildCommand = "cd theme/static_src && npm install && npm run build && cd ../.. && pip install -r requirements.txt && python manage.py collectstatic --noinput --clear"

[deploy]
startCommand = "python manage.py migrate --noinput && gunicorn GoSport.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
