{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh] text-center px-4">
    <div class="relative mb-8">
        <h1 class="text-9xl font-black text-white/5 select-none">404</h1>
        <div class="absolute inset-0 flex items-center justify-center">
            <div class="w-32 h-32 bg-neon/20 rounded-full blur-3xl animate-pulse"></div>
            <i data-lucide="ghost" class="w-24 h-24 text-neon drop-shadow-[0_0_15px_rgba(0,255,136,0.5)]"></i>
        </div>
    </div>

    <h2 class="text-4xl font-bold text-white mb-4 tracking-tight">¡Oops! Página perdida en la cancha</h2>
    <p class="text-gray-400 max-w-md mx-auto mb-10 text-lg leading-relaxed">
        El balón se fue fuera del estadio. La página que buscas no existe o ha sido movida a otro torneo.
    </p>

    <div class="flex flex-col sm:flex-row gap-4">
        <a href="{% url 'dashboard' %}" class="px-8 py-3 bg-neon text-dark font-bold rounded-xl hover:bg-neon/80 hover:scale-105 transition-all duration-300 shadow-lg shadow-neon/20 flex items-center gap-2">
            <i data-lucide="home" class="w-5 h-5"></i>
            Volver al Inicio
        </a>
        <button onclick="history.back()" class="px-8 py-3 bg-gray-800 text-white font-bold rounded-xl border border-gray-700 hover:bg-gray-700 transition-all duration-300 flex items-center gap-2">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
            Regresar
        </button>
    </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();
</script>
{% endblock %}
