{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10">
    <div class="bg-gray-900/50 backdrop-blur-md border border-gray-800/80 rounded-2xl overflow-hidden p-8 shadow-[0_0_30px_rgba(0,255,136,0.1)] relative">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-neon via-green-400 to-transparent"></div>
        
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-white mb-2">Reservar <span class="text-neon">{{ cancha.nombre }}</span></h2>
            <p class="text-gray-400 flex items-center gap-2">
                <svg class="w-4 h-4 text-neon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                {{ cancha.ubicacion }}
            </p>
        </div>



        <form method="POST" action="{% url 'negocio:crear_reserva' cancha.id %}" class="space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-300">Fecha</label>
                    <input type="text" name="fecha" id="id_fecha" required 
                           class="w-full bg-dark border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neon focus:ring-1 focus:ring-neon transition duration-300"
                           placeholder="Seleccione la fecha...">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-300">Desde</label>
                        <select name="hora" id="hora-inicio" required
                               class="w-full bg-dark border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neon focus:ring-1 focus:ring-neon transition duration-300">
                            <option value="">--:--</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-300">Hasta</label>
                        <select name="hora_fin" id="hora-fin" required
                               class="w-full bg-dark border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neon focus:ring-1 focus:ring-neon transition duration-300">
                            <option value="">--:--</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="precio-contenedor" class="bg-dark/50 p-6 rounded-xl border border-gray-800 flex flex-col gap-2">
                <div class="flex justify-between items-center">
                    <span class="text-gray-400">Precio por hora:</span>
                    <span class="text-white font-bold">$ {{ cancha.precio|floatformat:"0" }} COP</span>
                </div>
                <div class="flex justify-between items-center border-t border-gray-800 pt-2 mt-2">
                    <span class="text-gray-400 font-bold">Total a pagar:</span>
                    <span id="total-precio" class="text-3xl font-black text-neon">$ 0 COP</span>
                </div>
                <p id="error-rango" class="text-red-500 text-xs mt-1 hidden italic">La hora de fin debe ser posterior a la de inicio.</p>
            </div>

            <div class="flex gap-4 pt-4 border-t border-gray-800">
                <a href="{% url 'dashboard' %}" class="flex-1 text-center py-3 px-4 rounded-xl border border-gray-700 text-gray-300 hover:bg-gray-800 hover:text-white transition duration-300">
                    Cancelar
                </a>
                <button type="submit" class="flex-1 relative overflow-hidden bg-gray-800 text-white font-bold py-3 px-4 rounded-xl border border-gray-700 hover:border-neon transition-all duration-300 group">
                    <div class="absolute inset-0 bg-neon origin-left scale-x-0 group-hover:scale-x-100 transition-transform duration-300 ease-out"></div>
                    <span class="relative z-10 group-hover:text-black transition-colors duration-300">Confirmar Reserva</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Flatpickr CSS & JS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const fechaInput = document.getElementById('id_fecha');
    const horaInicioSelect = document.getElementById('hora-inicio');
    const horaFinSelect = document.getElementById('hora-fin');
    const totalPrecioSpan = document.getElementById('total-precio');
    const errorRango = document.getElementById('error-rango');
    const canchaId = {{ cancha.id }};
    const precioPorHora = {{ cancha.precio }};

    function calcularTotal() {
        const inicio = horaInicioSelect.value;
        const fin = horaFinSelect.value;
        
        if (inicio && fin) {
            const t1 = new Date(`2000-01-01T${inicio}`);
            const t2 = new Date(`2000-01-01T${fin}`);
            
            if (t2 > t1) {
                const diffMs = t2 - t1;
                const hours = diffMs / (1000 * 60 * 60);
                const total = hours * precioPorHora;
                totalPrecioSpan.textContent = `$ ${total.toLocaleString()} COP`;
                errorRango.classList.add('hidden');
            } else {
                totalPrecioSpan.textContent = `$ 0 COP`;
                errorRango.classList.remove('hidden');
            }
        } else {
            totalPrecioSpan.textContent = `$ 0 COP`;
            errorRango.classList.add('hidden');
        }
    }

    horaInicioSelect.addEventListener('change', function() {
        // Al cambiar inicio, sugerimos fin = inicio + 1h
        if (this.value) {
            const t = new Date(`2000-01-01T${this.value}`);
            t.setHours(t.getHours() + 1);
            const suggestedFin = t.toTimeString().slice(0, 5);
            
            // Buscar si existe en el select de fin
            for (let opt of horaFinSelect.options) {
                if (opt.value === suggestedFin) {
                    horaFinSelect.value = suggestedFin;
                    break;
                }
            }
        }
        calcularTotal();
    });

    horaFinSelect.addEventListener('change', calcularTotal);

    function cargarHorarios(dateStr) {
        if(!dateStr) {
            horaInicioSelect.innerHTML = '<option value="">--:--</option>';
            horaFinSelect.innerHTML = '<option value="">--:--</option>';
            return;
        }
        
        fetch(`/canchas/${canchaId}/slots/?fecha=${dateStr}`)
            .then(res => res.json())
            .then(data => {
                if(data.slots && data.slots.length > 0) {
                    horaInicioSelect.innerHTML = '<option value="">Seleccione...</option>';
                    horaFinSelect.innerHTML = '<option value="">Seleccione...</option>';
                    
                    data.slots.forEach(slot => {
                        const opt = document.createElement('option');
                        opt.value = slot;
                        opt.textContent = slot;
                        horaInicioSelect.appendChild(opt.cloneNode(true));
                        
                        // Para hora_fin, permitimos un slot después (ej. si el último slot es 21:00, el fin puede ser 22:00)
                        const optFin = opt.cloneNode(true);
                        horaFinSelect.appendChild(optFin);
                    });

                    // Añadir el último slot de fin posible (ej. +1h del último slot disponible)
                    if (data.slots.length > 0) {
                        const lastSlot = data.slots[data.slots.length - 1];
                        const t = new Date(`2000-01-01T${lastSlot}`);
                        t.setHours(t.getHours() + 1);
                        const finalFin = t.toTimeString().slice(0, 5);
                        const optFinal = document.createElement('option');
                        optFinal.value = finalFin;
                        optFinal.textContent = finalFin;
                        horaFinSelect.appendChild(optFinal);
                    }
                } else {
                    horaInicioSelect.innerHTML = '<option value="">No hay disponibilidad</option>';
                    horaFinSelect.innerHTML = '<option value="">No hay disponibilidad</option>';
                }
            });
    }

    // Initialize Flatpickr
    const maxDate = new Date();
    maxDate.setDate(maxDate.getDate() + 30); // 30 days max limit rule
    
    flatpickr(fechaInput, {
        locale: "es",
        minDate: "today",
        maxDate: maxDate,
        altInput: true,
        altFormat: "d \\de F Y",
        dateFormat: "Y-m-d",
        onChange: function(selectedDates, dateStr, instance) {
            cargarHorarios(dateStr);
        }
    });
});
</script>
{% endblock %}
